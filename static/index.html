<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slider Stopwatch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="stopwatch">
    <h1 class="stopwatch__title">Stopwatch</h1>

    <div class="display" id="display" role="timer" aria-live="off">00:00.00</div>

    <div class="controls">
      <button id="toggle" class="btn btn--primary" type="button">Start</button>
      <button id="reset" class="btn" type="button">Reset</button>
    </div>

    <div class="slider">
      <label class="slider__label" for="seek">
        Scrub time
        <span id="seekValue" class="slider__value">0.00s</span>
      </label>
      <input id="seek" class="slider__input" type="range" min="0" max="600" step="0.01" value="0" />
      <div class="slider__scale"><span>0s</span><span>5m</span><span>10m</span></div>
    </div>

    <p class="hint">
      Drag the slider to jump to any point — the stopwatch keeps counting from there.
      Keyboard: <kbd>Space</kbd> start/pause, <kbd>R</kbd> reset, arrow keys scrub.
    </p>
  </main>

  <script src="script.js"></script>
</body>
</html>
